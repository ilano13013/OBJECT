name: CI

on:
  push:
    branches: [master, main, 'claude/**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: SQL security tests
        run: supabase/tests/run.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --project=iphone
